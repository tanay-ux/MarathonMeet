name: MarathonMeet
options:
  bundleIdPrefix: com.marathonmeet
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MarathonMeet:
    type: application
    platform: iOS
    sources:
      - path: MarathonMeet
        excludes:
          - "Resources/GoogleService-Info.plist.example"
      - path: MarathonMeet/Assets.xcassets
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - target: MarathonMeetWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marathonmeet.app
        INFOPLIST_KEY_CFBundleDisplayName: MarathonMeet
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "MarathonMeet needs your location in the background so spectators can find you during the race."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MarathonMeet needs your location to show you on the map and alert you when the runner is nearby."
        INFOPLIST_KEY_UIBackgroundModes: "location remote-notification"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MarathonMeet/MarathonMeet.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

  MarathonMeetWatch:
    type: application
    platform: watchOS
    sources:
      - MarathonMeetWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marathonmeet.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: MarathonMeet
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.marathonmeet.app
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: MarathonMeetWatch/MarathonMeetWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marathonmeet.app

schemes:
  MarathonMeet:
    build:
      targets:
        MarathonMeet: all
        MarathonMeetWatch: all
    run:
      config: Debug
    archive:
      config: Release
